services:
  postgres-db:
    image: postgres:15-alpine
    container_name: miniecommerce-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password123!
      POSTGRES_DB: EcommerceDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis-cache:
    image: redis:7-alpine
    container_name: miniecommerce-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: